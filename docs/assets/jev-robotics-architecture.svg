<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">JEV-inspired architecture for robotics</title>
  <desc id="desc">Shared robot world-state encoding, query-conditioned decision embedding, independent skill embeddings, feasibility constraints, cost priors, parallel scoring and operator fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f0f5f2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#12352b" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#41536f"/></marker>
    <style>
      .title{font:700 36px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#15352f}.sub{font:400 18px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#526a65}.h{font:700 20px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#15352f}.t{font:400 16px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#334b46}.small{font:400 14px 'DejaVu Sans','Noto Sans SC',sans-serif;fill:#526a65}.formula{font:italic 20px Georgia,serif;fill:#2d4640}.box{stroke-width:2;rx:18;filter:url(#shadow)}.arrow{stroke:#41536f;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7d8ca3;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" rx="28" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" class="title">JEV-Inspired Robotics Decision Architecture</text>
  <text x="800" y="90" text-anchor="middle" class="sub">世界状态共享编码 · 技能集合动态扩展 · 物理约束先于概率归一化</text>

  <rect x="55" y="145" width="310" height="180" class="box" fill="#dff0ff" stroke="#4b86c6"/>
  <text x="210" y="182" text-anchor="middle" class="h">1 · Shared World State</text>
  <text x="80" y="220" class="t">end-effector · target pose</text><text x="80" y="249" class="t">payload · reach radius</text><text x="80" y="278" class="t">human distance · collision</text><text x="210" y="310" text-anchor="middle" class="small">世界模型只编码一次</text>

  <rect x="55" y="385" width="310" height="125" class="box" fill="#e8ddff" stroke="#7757c5"/>
  <text x="210" y="423" text-anchor="middle" class="h">2 · Task Question</text><text x="80" y="461" class="t">“Which bounded skill</text><text x="80" y="488" class="t">should execute next?”</text>

  <rect x="55" y="570" width="310" height="190" class="box" fill="#fff0dc" stroke="#d78b2f"/>
  <text x="210" y="608" text-anchor="middle" class="h">3 · Dynamic Skill Set</text>
  <rect x="82" y="632" width="118" height="38" rx="10" fill="#fff" stroke="#d78b2f"/><text x="141" y="657" text-anchor="middle" class="small">move</text>
  <rect x="218" y="632" width="118" height="38" rx="10" fill="#fff" stroke="#d78b2f"/><text x="277" y="657" text-anchor="middle" class="small">grasp</text>
  <rect x="82" y="686" width="118" height="38" rx="10" fill="#fff" stroke="#d78b2f"/><text x="141" y="711" text-anchor="middle" class="small">place</text>
  <rect x="218" y="686" width="118" height="38" rx="10" fill="#fff" stroke="#d78b2f"/><text x="277" y="711" text-anchor="middle" class="small">hold</text>
  <text x="210" y="750" text-anchor="middle" class="small">M-way ranking, no fixed head</text>

  <rect x="470" y="145" width="330" height="180" class="box" fill="#dff0ff" stroke="#4b86c6"/>
  <text x="635" y="185" text-anchor="middle" class="h">Shared State Encoder</text><text x="635" y="226" text-anchor="middle" class="formula">Hₓ ∈ ℝᴸˣᵈ</text>
  <g fill="#83b6ec"><rect x="520" y="259" width="38" height="28" rx="6"/><rect x="568" y="259" width="38" height="28" rx="6"/><rect x="616" y="259" width="38" height="28" rx="6"/><rect x="664" y="259" width="38" height="28" rx="6"/><rect x="712" y="259" width="38" height="28" rx="6"/></g>
  <text x="635" y="310" text-anchor="middle" class="small">robot memory / hidden states</text>

  <rect x="470" y="385" width="330" height="145" class="box" fill="#e8ddff" stroke="#7757c5"/>
  <text x="635" y="423" text-anchor="middle" class="h">Query–State Interaction</text><text x="635" y="458" text-anchor="middle" class="t">task-conditioned attention</text><text x="635" y="500" text-anchor="middle" class="formula">hqx = F(Hₓ, q) ∈ ℝᵈ</text>

  <rect x="470" y="590" width="330" height="150" class="box" fill="#fff0dc" stroke="#d78b2f"/>
  <text x="635" y="629" text-anchor="middle" class="h">Independent Skill Encoder</text><text x="635" y="670" text-anchor="middle" class="formula">O = [o₁ … oM] ∈ ℝᴹˣᵈ</text><text x="635" y="711" text-anchor="middle" class="small">tools and skills can change at runtime</text>

  <rect x="900" y="135" width="310" height="215" class="box" fill="#ffe3e3" stroke="#d95656"/>
  <text x="1055" y="174" text-anchor="middle" class="h">Physical Feasibility Gate</text><text x="930" y="213" class="t">• target reachability</text><text x="930" y="242" class="t">• payload limit</text><text x="930" y="271" class="t">• collision monitor</text><text x="930" y="300" class="t">• human separation</text><text x="1055" y="334" text-anchor="middle" class="small">hard feasible set 𝓕</text>

  <rect x="900" y="405" width="310" height="145" class="box" fill="#fff7d6" stroke="#c49b20"/>
  <text x="1055" y="443" text-anchor="middle" class="h">Task &amp; Cost Priors</text><text x="930" y="480" class="t">progress · time · energy</text><text x="1055" y="522" text-anchor="middle" class="formula">bᵢ = explicit utility prior</text>

  <rect x="900" y="610" width="310" height="160" class="box" fill="#e9e4ff" stroke="#7757c5"/>
  <text x="1055" y="649" text-anchor="middle" class="h">Parallel Skill Scoring</text><text x="1055" y="692" text-anchor="middle" class="formula">zᵢ = (hqxᵀoᵢ + bᵢ) / τ</text><text x="1055" y="733" text-anchor="middle" class="t">masked softmax over i ∈ 𝓕</text>

  <rect x="1315" y="305" width="240" height="270" class="box" fill="#ddf5e8" stroke="#309164"/>
  <text x="1435" y="344" text-anchor="middle" class="h">Typed Skill Decision</text><text x="1342" y="384" class="t">skill probabilities</text><text x="1342" y="416" class="t">feasibility reasons</text><text x="1342" y="448" class="t">confidence + entropy</text><line x1="1342" y1="475" x2="1528" y2="475" stroke="#8bbca4"/><text x="1435" y="511" text-anchor="middle" class="t">execute via separate</text><text x="1435" y="539" text-anchor="middle" class="t">certified controller</text><text x="1435" y="562" text-anchor="middle" class="small">or request operator</text>

  <path d="M365 235 H470" class="arrow"/><path d="M365 447 H470" class="arrow"/><path d="M365 665 H470" class="arrow"/><path d="M635 325 V385" class="arrow"/><path d="M800 457 H855 V660 H900" class="arrow"/><path d="M800 665 H900" class="arrow"/><path d="M1055 350 V405" class="dash"/><path d="M1055 550 V610" class="dash"/><path d="M1210 690 H1260 V440 H1315" class="arrow"/>

  <rect x="105" y="850" width="1390" height="78" rx="18" fill="#fff" stroke="#cbd5e5" stroke-width="2"/>
  <circle cx="155" cy="889" r="12" fill="#4b86c6"/><text x="178" y="895" class="small">shared representation</text><circle cx="385" cy="889" r="12" fill="#7757c5"/><text x="408" y="895" class="small">query-conditioned decision</text><circle cx="690" cy="889" r="12" fill="#d78b2f"/><text x="713" y="895" class="small">dynamic skills</text><circle cx="925" cy="889" r="12" fill="#d95656"/><text x="948" y="895" class="small">our physical constraints</text><circle cx="1215" cy="889" r="12" fill="#309164"/><text x="1238" y="895" class="small">bounded output</text>
  <text x="800" y="962" text-anchor="middle" class="small">Research architecture · normalized demo probabilities are not empirically calibrated · never command physical hardware directly</text>
</svg>
